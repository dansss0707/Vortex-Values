name: 30-Minute Catalog Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd vortex-values
          npm install @supabase/supabase-js puppeteer

      - name: Run Catalog Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VORTEX_USERNAME: ${{ secrets.VORTEX_USERNAME }}
          VORTEX_PASSWORD: ${{ secrets.VORTEX_PASSWORD }}
        run: |
          cd vortex-values
          node src/sync.js
